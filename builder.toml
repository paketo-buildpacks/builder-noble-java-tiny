description = "Ubuntu 24.04 Noble Numbat tiny image with only Java buildpacks included. To use, specify buildpacks at build time."

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java-native-image:14.14.2"
  version = "14.14.2"

[[buildpacks]]
  uri = "docker://docker.io/paketobuildpacks/java:22.7.2"
  version = "22.7.2"

[lifecycle]
  version = "0.21.26"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java-native-image"
    version = "14.14.2"

[[order]]

  [[order.group]]
    id = "paketo-buildpacks/java"
    version = "22.7.2"

[stack]
  build-image = "docker.io/paketobuildpacks/ubuntu-noble-build:0.0.152"
  id = "io.buildpacks.stacks.noble"
  run-image = "docker.io/paketobuildpacks/ubuntu-noble-run-tiny:0.0.152"

[[targets]]
  arch = "amd64"
  os = "linux"

[[targets]]
  arch = "arm64"
  os = "linux"
