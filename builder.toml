description = 'Ubuntu 24.04 Noble Numbat tiny image with only Java buildpacks included. To use, specify buildpacks at build time.'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java-native-image:14.14.4'
version = '14.14.4'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java:22.8.0'
