description = 'Ubuntu 24.04 Noble Numbat tiny image with only Java buildpacks included. To use, specify buildpacks at build time.'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java-native-image:14.16.0'
version = '14.16.0'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java:22.11.0'
version = '22.11.0'

[lifecycle]
version = '0.21.30'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/java-native-image'
version = '14.16.0'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/java'
version = '22.11.0'

[stack]
id = 'io.buildpacks.stacks.noble'
build-image = 'docker.io/paketobuildpacks/ubuntu-noble-build:0.0.166'
run-image = 'docker.io/paketobuildpacks/ubuntu-noble-run-tiny:0.0.166'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'
